# Builds the Xenix Mail core image from main and publishes it to GHCR.
# docker-compose.yml runs ghcr.io/codexenix/xenixmail-core:latest, and `bm update` pulls main plus this image.
# The build uses the committed core/public/dist, so rebuild the frontend into it before merging to main.
name: core image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      # main.go only: run_dev.go is a second main() in the same package
      - name: Build core binary
        working-directory: core
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o billionmail-amd64 main.go

      # The Dockerfile expects its scripts at the context root and the core files under core/
      - name: Assemble build context
        run: |
          mkdir -p ctx/core
          cp Dockerfiles/core/* ctx/
          cp core/billionmail-amd64 ctx/core/
          cp -r core/manifest core/languages core/public core/resource core/template ctx/core/

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ponytail: amd64 only; add linux/arm64 (and a GOARCH=arm64 binary) if a server is ever ARM
      - uses: docker/build-push-action@v6
        with:
          context: ctx
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/codexenix/xenixmail-core:latest
            ghcr.io/codexenix/xenixmail-core:sha-${{ github.sha }}
